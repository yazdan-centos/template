spring.application.name=template

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/template}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sgsec!1390}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.forward-headers-strategy=framework

# Base64-encoded secret containing at least 32 random bytes. The application
# deliberately refuses to start without this value.
app.jwt.secret=${APP_JWT_SECRET:hG9v8Z3q2J5x7Kp4Yt9mQ2sVbFh1nR0aYz4pQwE7rU=}
app.jwt.issuer=${APP_JWT_ISSUER:template-api}
app.jwt.expiration=${APP_JWT_EXPIRATION:PT1H}

# Comma-separated browser origins. Same-origin deployments need no CORS entry.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000}

# Optional bootstrap account. Keep disabled in production after provisioning.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin}

# Imports classpath:static/persons.json, skipping emails already in the database.
app.bootstrap-persons.enabled=${APP_BOOTSTRAP_PERSONS_ENABLED:true}
