services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: template
      POSTGRES_PASSWORD: change-this-database-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - template-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  template-postgres:

